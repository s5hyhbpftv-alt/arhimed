<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АРХИМЕД · Лаборатория Лавуазье · Миссия и 3D</title>
<style>
  :root { --brick:#7A4A33; --brick-dark:#5c3623; --amber:#E8A33D; --fog:#9FB4C7;
    --ink:#2c2318; --parch:#f6ecd2; --paper:#fdf9ee; --night:#141F38; --glow:#7FD1FF; --olive:#5F7A3A; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Georgia,"Times New Roman",serif;
    background: radial-gradient(ellipse at 50% 0%,#3a3328 0%,transparent 55%), linear-gradient(165deg,#2e2a24 0%,#1c1915 70%);
    color:var(--parch); min-height:100vh; display:flex; justify-content:center; padding:16px 12px; }
  #app { max-width:860px; width:100%; }
  header { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
    padding:8px 2px 10px; border-bottom:1px solid rgba(232,163,61,.35); margin-bottom:10px; }
  h1 { font-size:19px; color:var(--amber); font-weight:normal; }
  .sub { font-size:12px; color:#8a94ad; }
  .hud { display:flex; gap:12px; font-size:13px; color:var(--fog); flex-wrap:wrap; }
  .hud b { color:var(--amber); }
  .progress { display:flex; gap:5px; margin-bottom:10px; }
  .dot { flex:1; height:7px; border-radius:4px; background:#3a3a33; }
  .dot.done { background:var(--olive); }
  .dot.current { background:var(--amber); }
  .mission { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:#1f1c16;
    border:1px solid rgba(232,163,61,.3); border-radius:9px; padding:8px 14px; margin-bottom:10px; font-size:13.5px; }
  .mission .m-ico { font-size:18px; }
  .mission .m-text { color:#cbb89a; }
  .mission b { color:var(--amber); }
  .rank-badge { margin-left:auto; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--glow); }
  .stage { position:relative; border:1px solid rgba(232,163,61,.4); border-radius:12px; overflow:hidden;
    background:radial-gradient(ellipse at 50% 30%,#2b2720,#16130f); margin-bottom:12px; }
  .stage::after { content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(0,0,0,.4) 100%);
    mix-blend-mode:multiply; }
  .stage canvas { display:block; width:100%; height:auto; }
  .stage-cap { position:absolute; left:12px; bottom:8px; font-size:11.5px; color:#8a94ad; letter-spacing:.08em; }
  .card { background:linear-gradient(180deg,#26221c,#1d1a15); border:1px solid rgba(232,163,61,.4);
    border-radius:12px; padding:18px 20px; box-shadow:0 12px 34px rgba(0,0,0,.5); }
  .story { font-style:italic; color:#cbb89a; border-left:3px solid var(--brick); padding-left:12px; margin:8px 0; font-size:14px; line-height:1.5; }
  .q { font-size:15.5px; font-weight:bold; margin:8px 0 4px; }
  .arch { background:linear-gradient(135deg,rgba(44,62,107,.25),rgba(127,209,255,.08));
    border:1px solid rgba(127,209,255,.35); border-radius:8px; padding:9px 13px; margin:8px 0;
    color:#cfd8ea; font-size:13px; line-height:1.5; }
  .arch .who { display:block; font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:var(--amber); margin-bottom:2px; }
  .answer-row { display:flex; gap:8px; align-items:center; margin:10px 0 4px; flex-wrap:wrap; }
  input[type=number] { width:130px; font-family:Georgia,serif; font-size:19px; padding:8px 11px;
    border:2px solid var(--amber); border-radius:8px; background:#101018; color:var(--paper); outline:none; }
  select { font-family:Georgia,serif; font-size:14px; padding:8px 9px; border:2px solid var(--amber);
    border-radius:8px; background:#101018; color:var(--paper); }
  .choices { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .choice { background:#2a2620; border:1.5px solid #4a4538; border-radius:9px; padding:10px 13px;
    font-family:inherit; font-size:14px; text-align:left; color:var(--parch); cursor:pointer; }
  .choice:hover { border-color:var(--amber); }
  .choice.right { border-color:var(--olive); background:#243320; }
  .choice.wrong { border-color:#b0513c; background:#3a2218; }
  .hints { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .hint-btn { background:var(--olive); color:#fff; border:none; border-radius:7px; padding:7px 13px;
    font-family:inherit; font-size:12.5px; cursor:pointer; }
  .hint-btn:disabled { background:#3d4a30; cursor:not-allowed; }
  .hint-box { background:#2a2620; border:1px dashed var(--amber); border-radius:8px; padding:9px 12px; margin-top:8px; font-size:13px; color:#cbb89a; }
  .sliders { display:flex; gap:14px; flex-wrap:wrap; align-items:center; background:#1f1c16;
    border:1px solid rgba(232,163,61,.25); border-radius:9px; padding:9px 14px; margin-bottom:10px; font-size:12.5px; }
  .sliders label { display:flex; align-items:center; gap:8px; color:#cbb89a; }
  .sliders input[type=range] { width:110px; accent-color:var(--amber); }
  .sliders .live { margin-left:auto; color:var(--amber); font-weight:bold; }
  .fb { margin-top:9px; padding:9px 12px; border-radius:8px; font-size:13px; }
  .fb.right { background:#243320; border:1px solid var(--olive); }
  .fb.wrong { background:#3a2218; border:1px solid #b0513c; }
  .sol { background:#201c16; border:1px solid var(--amber); border-radius:9px; padding:11px 13px; margin-top:10px; font-size:13px; line-height:1.55; color:#d9c9a8; }
  .sol b { color:var(--amber); }
  .btn { background:linear-gradient(180deg,var(--brick),var(--brick-dark)); color:#fff; border:none;
    border-radius:9px; padding:10px 19px; font-family:inherit; font-size:14.5px; cursor:pointer; margin-top:12px; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .confetti { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50; }
  .confetti-piece { position:absolute; top:-12px; width:8px; height:14px; border-radius:2px; opacity:.9; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
  .note { text-align:center; font-size:11px; color:#5d6a8a; margin-top:10px; }

/* === мобильная адаптация (АРХИМЕД PWA) === */
@media (max-width: 640px){
  body { padding:10px 8px 28px; }
  h1 { font-size:17px; }
  #app { max-width:100%; }
  .card { padding:14px 13px; }
  .btn, .btn2, .btn3, .choice, .hint-btn, .hint { min-height:48px; font-size:15px; }
  .btn, .btn2, .btn3 { width:100%; padding:12px 16px; }
  .choice { padding:12px 14px; }
  .hud { font-size:12px; gap:8px; }
  .sliders, .controls { flex-direction:column; align-items:stretch; gap:10px; }
  .sliders input[type=range] { width:100%; }
  .answer-row { gap:6px; }
  input[type=number] { width:116px; font-size:19px; }
  .story, .q { font-size:14px; }
  .mission { padding:8px 10px; font-size:13px; }
  .protocol, .panel { padding:10px; overflow-x:auto; }
  .stage-cap { font-size:10px; }
  .note { font-size:10px; }
}

    story:'Лавуазье собирает газ в шар. Сколько литров занимает 1 моль любого газа при нормальных условиях (н.у.)?',
    q:'Объём 1 моль газа при н.у.?', type:'unit', unit:'л', answer:22.4, tol:0.1,
    hints:['Закон Авогадро: одинаковое число молекул — одинаковый объём.','1 моль любого газа при н.у. — это константа.','22,4 л.'],
    sol:'Vm = 22,4 л/моль — молярный объём любого газа при нормальных условиях.',

    art:'Резиновый шар' },
  { id:6, title:'Титрование', ch:'Гл.3 · Кислоты и щёлочи', diff:3,
    mission:'Проведи титрование: найди концентрацию NaOH!',
    beat:'Титрование точное: C(NaOH) = 0,1 М!',
    story:'На нейтрализацию 20 мл раствора HCl концентрации 0,1 М ушло ровно 20 мл раствора NaOH. Какова концентрация раствора NaOH?',
    q:'Концентрация NaOH?', type:'unit', unit:'М', answer:0.1, tol:0.01,
    hints:['Кислота и щёлочь реагируют 1:1.','Объёмы равны → концентрации равны.','0,1 М.'],

    art:'Бюретка' },
  { id:7, title:'Ядро кислорода', ch:'БОСС · Гл.4', diff:2,
    mission:'Босс: посчитай протоны в ядре кислорода!',
    beat:'Ядро разгадано: 8 протонов!',
    story:'Лавуазье показывает таблицу элементов: кислород стоит под номером 8. Сколько протонов в ядре атома кислорода?',
    q:'Сколько протонов в ядре кислорода?', type:'choice', choices:['6','8','16','32'], answer:1,
    hints:['Порядковый номер = число протонов.','Кислород — 8-й элемент.'],
    sol:'Число протонов = порядковый номер = 8. Масса 16 — это протоны + нейтроны.',
    trap:'Ответить 16 — это массовое число (протоны + нейтроны), а не протоны.',
    art:'Ядро атома' },

const RANKS = ['Стажёр','Юный химик','Лаборант','Алхимик','Повелитель Элементов'];

/* интерактивные параметры задач: ползунки + живой расчёт */
const TASK_FX = {
  1:{ params:[{k:'nH',label:'Атомов H',min:1,max:4,step:1,def:2},{k:'mO',label:'Масса O',min:8,max:32,step:8,def:16}],
     calc:P=>`M = ${P.nH}·1 + ${P.mO} = <b>${P.nH+P.mO}</b> г/моль` },
  4:{ params:[{k:'m',label:'Соль, г',min:5,max:40,step:5,def:20},{k:'V',label:'Раствор, г',min:50,max:300,step:50,def:100}],
     calc:P=>`ω = ${P.m}/${P.V} = <b>${(P.m/P.V*100).toFixed(0)}</b>%` },
  5:{ params:[{k:'n',label:'Молей',min:1,max:3,step:1,def:1}],
     calc:P=>`V = ${P.n}·22,4 = <b>${(P.n*22.4).toFixed(1)}</b> л` },
  6:{ params:[{k:'C1',label:'C(HCl), М',min:.05,max:.5,step:.05,def:.1},{k:'V1',label:'V(HCl), мл',min:10,max:40,step:5,def:20}],
     calc:P=>`C(NaOH) = C₁V₁/V₂ = <b>${(P.C1*P.V1/20).toFixed(2)}</b> М` },
};
let P = {};
const SAVE_KEY='arhimed_chem_v1';
let state={idx:0,points:0,streak:0,stars:0,solved:[],hintsUsed:{}};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)); if(s&&Array.isArray(s.solved)) state=Object.assign(state,s);}catch(e){}
let fb=null, chosen=null, showSol=false;

/* ================= 3D (фотореализм) ================= */
const stage = document.getElementById('stage3d');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x121a13, 0.055);
const camera = new THREE.PerspectiveCamera(42, 16/9, 0.1, 100);
camera.position.set(0, 4.6, 10.5); camera.lookAt(0, 1.6, 0);
/* окружение IBL (реальные отражения на материалах) */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
/* свет */
scene.add(new THREE.HemisphereLight(0xfff2dd, 0x2a1a0a, 0.65));
const dir = new THREE.DirectionalLight(0xffe2b8, 2.1);
dir.position.set(5,9,5); dir.castShadow = true;
dir.shadow.mapSize.set(1024,1024); dir.shadow.radius = 4; dir.shadow.bias = -0.0004;
dir.shadow.camera.left=-6; dir.shadow.camera.right=6; dir.shadow.camera.top=6; dir.shadow.camera.bottom=-6;
scene.add(dir);
scene.add(new THREE.DirectionalLight(0x7fd1ff, 0.55).translateX(-5).translateY(3).translateZ(-4));
scene.add(new THREE.DirectionalLight(0xffffff, 0.25).translateY(3).translateZ(9));
/* пост-обработка: SSAO + Bloom */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const ssao = new SSAOPass(scene, camera, 512, 512); ssao.kernelRadius = 5; composer.addPass(ssao);
const bloom = new UnrealBloomPass(new THREE.Vector2(512,288), 0.18, 0.5, 0.85); composer.addPass(bloom);
/* старая булыжная мостовая */
function benchTexture(seed=7){
  const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d');
  let s=seed; const rnd=()=>{s=(s*1664525+1013904223)>>>0; return s/4294967296;};
  x.fillStyle='#16120d'; x.fillRect(0,0,256,256);
  const tones=['#3a2f22','#33291e','#3e3325','#2f261a'];
  for(let i=0;i<4;i++){ const y0=i*64+3;
    x.fillStyle=tones[i]; x.fillRect(0,y0,256,56);
    x.fillStyle='rgba(0,0,0,.65)'; x.fillRect(0,y0+56,256,3);
    for(let g=0;g<22;g++){ x.fillStyle=`rgba(0,0,0,${0.05+rnd()*0.13})`; x.fillRect(rnd()*256,y0+rnd()*50,12+rnd()*44,2+rnd()*4); }
    x.fillStyle='rgba(255,230,190,0.05)'; x.fillRect(0,y0+6,256,5);
  }
  for(let i=0;i<26;i++){ x.fillStyle=`rgba(217,164,65,${0.03+rnd()*0.05})`; x.fillRect(rnd()*256,rnd()*256,20+rnd()*60,1+rnd()*3); }
  const tex=new THREE.CanvasTexture(c); tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.colorSpace=THREE.SRGBColorSpace; tex.repeat.set(4,4); tex.anisotropy=4; return tex;
}
const ground = new THREE.Mesh(new THREE.CircleGeometry(6, 48),
  new THREE.MeshStandardMaterial({ map: benchTexture(), roughness: 0.8, envMapIntensity: 0.55 }));
ground.rotation.x=-Math.PI/2; ground.position.y=-0.02; ground.receiveShadow = true; scene.add(ground);

const M = (c,r=.5)=>new THREE.MeshStandardMaterial({color:c, roughness:r, envMapIntensity:1.1});
let taskGroup = null; let anim = null; let sol = null; let solAnim = null;

function clear3D(){ if(taskGroup){ scene.remove(taskGroup); taskGroup.traverse(o=>{ if(o.geometry)o.geometry.dispose(); if(o.material)o.material.dispose(); }); taskGroup=null; } anim=null; sol=null; solAnim=null; }

const B3D = {
 1:{ build:(g)=>{ const bond=(x1,y1,z1,x2,y2,z2)=>{ const v=new THREE.Vector3(x2-x1,y2-y1,z2-z1), L=v.length();
      const b=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,L,6),M(0x9fb4c7,.4));

/* стрелка-вектор для разбора решения */
function vec(c){ const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.75,8),M(c,.25)).translateY(.37));
  g.add(new THREE.Mesh(new THREE.ConeGeometry(.095,.26,8),M(c,.25)).translateY(.88));
  return g; }
function buildSol(id){
  sol = new THREE.Group();
  if(id===1){ const hi=new THREE.Mesh(new THREE.SphereGeometry(.4,16,16),new THREE.MeshBasicMaterial({color:0xd9a441,transparent:true,opacity:.4})); hi.position.set(0,.7,0); sol.add(hi); }
  else if(id===3){ const hi=new THREE.Mesh(new THREE.BoxGeometry(4,2.4,1),new THREE.MeshBasicMaterial({color:0xd9a441,transparent:true,opacity:.22})); hi.position.set(0,.5,0); sol.add(hi); }
  else if(id===5){ sol.a=vec(0xe8a33d); sol.add(sol.a);
    solAnim=()=>{ sol.a.position.set(1.5,1.15,0); sol.a.rotation.x=Math.PI/2; sol.a.scale.setScalar(1); }; }
  else if(id===6){ sol.a=vec(0xe86a8a); sol.add(sol.a);
    solAnim=()=>{ sol.a.position.set(.2,1,0); sol.a.rotation.z=-Math.PI/2; sol.a.scale.setScalar(1); }; }
  else if(id===7){ for(let i=0;i<8;i++){ const p=new THREE.Mesh(new THREE.SphereGeometry(.06,8,8),new THREE.MeshBasicMaterial({color:0xd9a441}));
      const a=i/8*Math.PI*2; p.position.set(.15*Math.cos(a),1.2,.15*Math.sin(a)); sol.add(p); } }
  scene.add(sol);
}

function build3D(idx){
  clear3D();
  const builder=B3D[idx]; if(!builder) return;
  taskGroup=new THREE.Group(); builder.build(taskGroup); scene.add(taskGroup);
  taskGroup.traverse(o=>{ if(o.isMesh) o.castShadow = true; });
  const size=stage.clientWidth||860; renderer.setSize(size, size*9/16);
  composer.setSize(size, size*9/16);
  composer.render();
}
function tick(){ requestAnimationFrame(tick);
  if(anim&&TASKS[state.idx]&&B3D[TASKS[state.idx].id]&&B3D[TASKS[state.idx].id].anim) B3D[TASKS[state.idx].id].anim(performance.now()/1000);
  if(solAnim) solAnim(performance.now()/1000);
  composer.render(); }
tick();

/* ================= UI ================= */
function save(){ try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){} }
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
const rank=()=>RANKS[Math.min(Math.floor(state.stars||0),4)];

function render(){
  document.getElementById('hudPoints').textContent=state.points;
  document.getElementById('hudStreak').textContent=state.streak;
  document.getElementById('hudRank').textContent=rank();
  document.getElementById('progress').innerHTML=TASKS.map((t,i)=>`<div class="dot ${state.solved[i]?'done':(i===state.idx?'current':'')}"></div>`).join('');
  const t=TASKS[state.idx]; if(!t){finish();return;}
  document.getElementById('mission').innerHTML=
    `<span class="m-ico">🎯</span><span class="m-text"><b>Миссия ${state.idx+1}/${TASKS.length}:</b> ${esc(t.mission)}</span><span class="rank-badge">${esc(t.ch)}</span>`;
  document.getElementById('stageCap').textContent='3D: '+t.title;
  /* ползунки параметров задачи */
  const fx=TASK_FX[t.id], sl=document.getElementById('sliders');
  if(fx&&fx.params){ P={}; fx.params.forEach(pr=>P[pr.k]=pr.def);
    sl.innerHTML=fx.params.map(pr=>`<label>${pr.label}
      <input type="range" min="${pr.min}" max="${pr.max}" step="${pr.step}" value="${P[pr.k]}" oninput="setP('${pr.k}',this.value)">
      <span id="pv_${pr.k}">${P[pr.k]}</span></label>`).join('')
      +`<span class="live" id="liveCalc">${fx.calc(P)}</span>`;
  } else { sl.innerHTML=''; P={}; }
  build3D(t.id);
  if(showSol){ buildSol(t.id); }
  const card=document.getElementById('card');
  const hints=[0,1,2].map(i=>{ const used=(state.hintsUsed[state.idx]||0)>i;
    return `<button class="hint-btn" ${used?'disabled':''} onclick="useHint(${i})">Подсказка ${i+1}${i<2?' · '+(i===0?10:5)+'⭐':' · бесплатно'}</button>`; }).join('');
  const openHints=[0,1,2].filter(i=>(state.hintsUsed[state.idx]||0)>i).map(i=>`<div class="hint-box">${esc(t.hints[i])}</div>`).join('');
  const solved=state.solved[state.idx];
  const input=t.type==='unit'
    ? `<div class="answer-row"><input type="number" id="numIn" step="any" placeholder="число" ${solved?'disabled':''}>
        <select id="unitIn" ${solved?'disabled':''}>${unitsOptions(t.unit)}</select>
        <button class="btn" style="margin-top:0" onclick="checkUnit()" ${solved?'disabled':''}>Ответить</button></div>`
    : `<div class="choices">${t.choices.map((c,i)=>`<button class="choice ${solved?(i===t.answer?'right':(chosen===i?'wrong':'')):''}" ${solved?'disabled':''} onclick="checkChoice(${i})">${esc(c)}</button>`).join('')}</div>`;
  const fbHtml=fb?`<div class="fb ${fb.ok?'right':'wrong'}">${esc(fb.txt)}</div>`:'';
  const solHtml=showSol?`<div class="sol"><b>📜 Решение Архимеда:</b> ${esc(t.sol)}<br><span style="color:var(--olive)">✅ ${esc(t.beat)}</span></div>
    <button class="btn" onclick="next()">${state.idx===TASKS.length-1?'Забрать трофей':'Дальше →'}</button>`:'';
  card.innerHTML=`
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px">
      <span style="color:#8a94ad;font-size:11.5px;letter-spacing:.14em">${esc(t.ch)}</span>
      <span style="color:var(--amber);font-size:11.5px">сложность ${t.diff}/4</span></div>
    <div style="font-size:16.5px;font-weight:bold;margin-top:6px">${esc(t.title)}</div>
    <div class="story">${esc(t.story)}</div>
    <div class="q">${esc(t.q)}</div>${input}
    <div class="hints">${hints}</div>${openHints}${fbHtml}${solHtml}`;
}
function unitsOptions(unit){ const map={'г/моль':['г/моль'],'г':['г'],'молекул':['молекул'],'%':['%'],'л':['л'],'М':['М']};
  return (map[unit]||[unit]).map(u=>`<option>${u}</option>`).join(''); }
function useHint(i){ const t=TASKS[state.idx]; if(state.solved[state.idx])return; if((state.hintsUsed[state.idx]||0)>i)return;
  if(i<2){ const cost=i===0?10:5; if(state.points<cost)return; state.points-=cost; }
  state.hintsUsed[state.idx]=(state.hintsUsed[state.idx]||0)+1; save(); render(); }
function checkChoice(i){ const t=TASKS[state.idx]; if(state.solved[state.idx])return; chosen=i;
  if(i===t.answer) win(t); else { fb={ok:false,txt:'❌ «А ты уверен?» '+t.trap}; render(); } }
function checkUnit(){ const t=TASKS[state.idx]; if(state.solved[state.idx])return;
  const n=parseFloat(document.getElementById('numIn').value); const u=document.getElementById('unitIn').value;
  if(isNaN(n)){ fb={ok:false,txt:'Введи число!'}; render(); return; }
  const conv={'г/моль':1,'г':1,'молекул':1,'%':1,'л':1,'М':1};
  const si=n*(conv[u]||1);
  if(Math.abs(si-t.answer)<=t.tol) win(t); else { fb={ok:false,txt:'❌ «А ты уверен?» '+t.trap}; render(); } }
function win(t){ const h=state.hintsUsed[state.idx]||0; const gain=Math.max(15,30-h*5);
  state.points+=gain; state.streak+=1; state.solved[state.idx]=true; state.stars=(state.stars||0)+1; showSol=true;
  fb={ok:true,txt:`✅ Верно! +${gain}⭐ · артефакт «${t.art}»`}; save(); render(); }
function next(){ state.idx+=1; fb=null; chosen=null; showSol=false; save(); render(); }
function finish(){
  document.getElementById('progress').innerHTML=TASKS.map(()=>`<div class="dot done"></div>`).join('');
  document.getElementById('mission').innerHTML=`<span class="m-ico">🏆</span><span class="m-text"><b>Лондон спасён!</b> Ньютон принимает тебя в ученики. Звание: <b>${rank()}</b></span>`;
  document.getElementById('card').innerHTML=`
    <div style="font-size:22px;font-weight:bold;margin-bottom:8px">🏆 Лаборатория Лавуазье пройдена!</div>
    <div class="arch"><span class="who">◈ Архимед</span>
      «Ты прошёл всю химию острова: молекулы, уравнения, растворы и газы.
      Лавуазье бы тобой гордился — а впереди таблица элементов и синтез». Очки: <b style="color:var(--amber)">${state.points}</b>⭐ · серия ${state.streak}🔥</div>
    <button class="btn" onclick="resetAll()">↺ Пройти заново</button>`;
  showConfetti();
}
function resetAll(){ if(!confirm('Сбросить прогресс?'))return;
  state={idx:0,points:0,streak:0,stars:0,solved:[],hintsUsed:{}}; fb=null; chosen=null; showSol=false; save(); render(); }
function showConfetti(){ const d=document.createElement('div'); d.className='confetti';
  for(let i=0;i<70;i++){ const s=document.createElement('span'); s.className='confetti-piece';
    s.style.left=Math.random()*100+'%'; s.style.background=['#d9a441','#c8795a','#7fb8a0','#b06fd0','#6fb4f0'][i%5];
    s.style.animationDelay=Math.random()*0.6+'s'; s.style.animationDuration=1.6+Math.random()*1.4+'s'; d.appendChild(s); }
  document.body.appendChild(d); setTimeout(()=>d.remove(),4000); }

window.useHint=useHint; window.checkChoice=checkChoice; window.checkUnit=checkUnit; window.next=next; window.resetAll=resetAll;
window.setP=(k,v)=>{ P[k]=parseFloat(v); const fx=TASK_FX[TASKS[state.idx].id];
  if(fx&&fx.params){ fx.params.forEach(pr=>{ const el=document.getElementById('pv_'+pr.k); if(el)el.textContent=P[pr.k]; });
    const lc=document.getElementById('liveCalc'); if(lc&&fx.calc) lc.innerHTML=fx.calc(P); }
  if([2,3,4,9].includes(TASKS[state.idx].id)) build3D(state.idx); };
window.addEventListener('resize',()=>{ const s=stage.clientWidth||860; renderer.setSize(s, s*9/16); composer.setSize(s, s*9/16); });
render();
</script>
