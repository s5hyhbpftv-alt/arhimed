<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АРХИМЕД · Фотореалистичная химия · Лаборатория Лавуазье</title>
<style>
  :root { --oak:#4A3728; --amber:#A67B5B; --parch:#f6ecd2; --ink:#3a3228; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:Georgia,"Times New Roman",serif;
    background:radial-gradient(ellipse at 50% 0%,#20243a 0%,#0e1220 70%);
    color:#e8e2d4; min-height:100vh; display:flex; justify-content:center; padding:18px 14px;
  }
  #app { max-width:1240px; width:100%; }
  header { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  h1 { font-size:22px; color:#d9b98a; letter-spacing:.5px; }
  .sub { font-size:13px; color:#8a94ad; }
  .card {
    background:linear-gradient(180deg,#181d30,#10141f);
    border:1px solid #2c3452; border-radius:14px; padding:14px;
    box-shadow:0 14px 40px rgba(0,0,0,.55);
  }
  canvas { display:block; width:100%; height:auto; border-radius:10px; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:14px; }
  .sub-btn {
    background:#1c2340; color:#c8d2ea; border:1px solid #37406b; border-radius:9px;
    padding:8px 14px; font-family:inherit; font-size:13px; cursor:pointer; transition:all .15s;
  }
  .sub-btn:hover { border-color:#d9b98a; color:#f2e6c9; }
  .sub-btn.sel { background:#d9b98a; color:#201a10; border-color:#d9b98a; font-weight:bold; }
  .info {
    margin-top:12px; padding:12px 14px; background:#141928; border:1px solid #2c3452;
    border-radius:10px; font-size:13.5px; line-height:1.55; color:#aab4cc;
  }
  .info b { color:#d9b98a; }
  .note { text-align:center; font-size:11.5px; color:#5d6unão; margin-top:10px; }
  .note { color:#5d6a8a; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>⚗ Фотореалистичная сцена · Лаборатория Лавуазье</h1>
      <div class="sub">Стекло, свет и растворы — пример визуального стиля «АРХИМЕД» для химического модуля</div>
    </div>
    <div class="sub" id="fpsLabel">—</div>
  </header>

  <div class="card">
    <canvas id="scene" width="1200" height="760"></canvas>
    <div class="controls" id="controls"></div>
  </div>

  <div class="info" id="info"></div>
  <div class="note">Интерактивный пример · canvas 2D · техники фотореализма: мениски, преломление стекла, блики, rim-light, мягкие тени · нажмите на вещество, чтобы сменить раствор</div>
</div>

<script>
/* ============ ВЕЩЕСТВА ============ */
const SUBSTANCES = [
  { id:'cuso4',  name:'Сульфат меди · CuSO₄',  color:'#2e7fd4', light:'#6fb4f0', dark:'#1d55a0',
    desc:'Голубой раствор: ионы Cu²⁺ поглощают красный свет и отражают сине-голубой.' },
  { id:'kmno4',  name:'Перманганат калия · KMnO₄', color:'#7a2a9e', light:'#b06fd0', dark:'#4e1868',
    desc:'Фиолетовый раствор: ион MnO₄⁻ — сильный окислитель, цвет от переноса заряда.' },
  { id:'fecl3',  name:'Хлорид железа · FeCl₃', color:'#b07a2a', light:'#d8a75f', dark:'#7a4e14',
    desc:'Жёлто-бурый раствор: аквакомплексы Fe³⁺. Классика качественного анализа.' },
  { id:'k2cr2o7',name:'Дихромат калия · K₂Cr₂O₇', color:'#d4641d', light:'#f0a04f', dark:'#9e3f10',
    desc:'Оранжевый раствор: ион Cr₂O₇²⁻. В щёлочи становится жёлтым — хромат.' },
];
let cur = SUBSTANCES[0];

/* ============ КАНВАС ============ */
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
let time = 0;

/* ============ ФОНОВЫЕ СЛОИ (рис. один раз) ============ */
let bgCanvas = null;
function renderBackground() {
  bgCanvas = document.createElement('canvas'); bgCanvas.width = W; bgCanvas.height = H;
  const b = bgCanvas.getContext('2d');
  // студийный фон
  const g = b.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2a3050'); g.addColorStop(0.45, '#1a1f35'); g.addColorStop(1, '#0d101c');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  // мягкое пятно света за центральной колбой
  const glow = b.createRadialGradient(560, 300, 30, 560, 300, 340);
  glow.addColorStop(0, 'rgba(255,220,170,0.10)'); glow.addColorStop(1, 'rgba(255,220,170,0)');
  b.fillStyle = glow; b.fillRect(0, 0, W, H);
  // верхняя тень (виньетка)
  const vg = b.createRadialGradient(600, 380, 200, 600, 380, 800);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  b.fillStyle = vg; b.fillRect(0, 0, W, H);
  // деревянный стол
  const benchY = 552;
  const bg2 = b.createLinearGradient(0, benchY, 0, H);
  bg2.addColorStop(0, '#6b4a2c'); bg2.addColorStop(0.15, '#5a3d24');
  bg2.addColorStop(0.7, '#3c2817'); bg2.addColorStop(1, '#241708');
  b.fillStyle = bg2; b.fillRect(0, benchY, W, H - benchY);
  // доски
  b.strokeStyle = 'rgba(0,0,0,0.35)'; b.lineWidth = 1.5;
  for (let i = 0; i < 6; i++) {
    const yy = benchY + 6 + i * 34;
    b.beginPath(); b.moveTo(0, yy); b.lineTo(W, yy); b.stroke();
  }
  // блик на столе от света
  const benchGlow = b.createRadialGradient(520, benchY + 6, 10, 520, benchY + 6, 300);
  benchGlow.addColorStop(0, 'rgba(255,215,160,0.14)'); benchGlow.addColorStop(1, 'rgba(0,0,0,0)');
  b.fillStyle = benchGlow; b.fillRect(0, benchY, W, H - benchY);
  // задняя полка-силуэт
  b.fillStyle = 'rgba(10,13,24,0.85)';
  b.fillRect(0, 84, W, 14);
}

/* ============ СТЕКЛО ============ */
function glassStroke(x, y, w, h, r, lw, alpha) {
  ctx.strokeStyle = 'rgba(220,235,255,' + alpha + ')'; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.stroke();
}
function glassHighlight(x, y, w, h, r) {
  // блик-полоса слева-сверху
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.clip();
  const hg = ctx.createLinearGradient(x + 4, y, x + w * 0.35, y + h);
  hg.addColorStop(0, 'rgba(255,255,255,0.35)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(x, y, w * 0.5, h);
  ctx.restore();
}
function softShadow(x, y, w, h, blur) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = blur;
  ctx.fillStyle = 'rgba(0,0,0,0.0)';
  ctx.beginPath(); ctx.ellipse(x + w / 2, y + h, w * 0.42, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* ============ КОЛБА Эрленмейера ============ */
function drawFlask(bx, by, bw, col) {
  const bh = 250;            // высота корпуса
  const neckW = 34, neckH = 46;
  const cx = bx + bw / 2;
  const bodyTop = by + neckH;
  const liq = 0.62;          // уровень жидкости
  const liqTop = bodyTop + (bh - neckH) * (1 - liq) * 0.9;
  // тень
  softShadow(bx - 14, by + bh - 12, bw + 28, 0, 22);
  // корпус (стекло)
  ctx.beginPath();
  ctx.moveTo(cx - neckW / 2, by);
  ctx.lineTo(cx + neckW / 2, by);
  ctx.lineTo(cx + neckW / 2, bodyTop);
  ctx.bezierCurveTo(bx + bw * 0.55, bodyTop + 30, bx + bw * 0.9, bodyTop + 90, bx + bw * 0.88, by + bh - 40);
  ctx.quadraticCurveTo(bx + bw * 0.85, by + bh - 6, cx, by + bh - 6);
  ctx.quadraticCurveTo(bx + bw * 0.15, by + bh - 6, bx + bw * 0.12, by + bh - 40);
  ctx.bezierCurveTo(bx + bw * 0.1, bodyTop + 90, bx + bw * 0.45, bodyTop + 30, cx - neckW / 2, bodyTop);
  ctx.closePath();
  ctx.fillStyle = 'rgba(210,228,250,0.10)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(225,238,255,0.5)'; ctx.lineWidth = 2;
  ctx.stroke();
  // жидкость внутри (с мениском)
  ctx.save();
  ctx.clip();
  const lg = ctx.createLinearGradient(0, liqTop, 0, by + bh);
  lg.addColorStop(0, col.light); lg.addColorStop(0.5, col.color); lg.addColorStop(1, col.dark);
  ctx.fillStyle = lg;
  ctx.beginPath();
  ctx.moveTo(cx - neckW / 2, liqTop + 8);
  ctx.lineTo(cx + neckW / 2, liqTop + 8);
  ctx.lineTo(cx + neckW / 2, bodyTop + 6);
  ctx.bezierCurveTo(bx + bw * 0.53, bodyTop + 32, bx + bw * 0.87, bodyTop + 90, bx + bw * 0.86, by + bh - 40);
  ctx.quadraticCurveTo(bx + bw * 0.83, by + bh - 6, cx, by + bh - 6);
  ctx.quadraticCurveTo(bx + bw * 0.17, by + bh - 6, bx + bw * 0.14, by + bh - 40);
  ctx.bezierCurveTo(bx + bw * 0.13, bodyTop + 90, bx + bw * 0.47, bodyTop + 32, cx - neckW / 2, bodyTop + 6);
  ctx.closePath(); ctx.fill();
  // мениск
  ctx.fillStyle = 'rgba(255,255,255,0.30)';
  ctx.beginPath(); ctx.ellipse(cx, liqTop + 8, neckW / 2 - 2, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  // пузырьки
  for (let i = 0; i < 7; i++) {
    const ph = (time * (0.6 + i * 0.12) + i * 13) % 1;
    const px = cx + (Math.sin(time * 2 + i * 2.1) * 30 + (i - 3) * 16);
    const py = by + bh - 14 - ph * (bh - 60);
    const r = 2.5 + (i % 3) * 1.6;
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.arc(px - r * 0.3, py - r * 0.3, r * 0.35, 0, Math.PI * 2); ctx.fill();
  }
  // преломление: размытая полоса света сквозь жидкость
  const refr = ctx.createLinearGradient(bx + bw * 0.35, 0, bx + bw * 0.6, 0);
  refr.addColorStop(0, 'rgba(255,255,255,0)'); refr.addColorStop(0.5, 'rgba(255,255,255,0.18)'); refr.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = refr;
  ctx.fillRect(bx + bw * 0.2, liqTop, bw * 0.6, by + bh - liqTop);
  ctx.restore();
  // блики стекла поверх жидкости
  glassHighlight(bx, by, bw, bh, 8);
  ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.arc(cx, bodyTop + 34, 26, Math.PI * 1.15, Math.PI * 1.45); ctx.stroke();
  // отражение на столе
  ctx.save();
  ctx.globalAlpha = 0.16;
  const rf = ctx.createLinearGradient(0, by + bh, 0, by + bh + 46);
  rf.addColorStop(0, col.color); rf.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rf;
  ctx.beginPath(); ctx.ellipse(cx, by + bh + 6, bw * 0.42, 20, 0, 0, Math.PI); ctx.fill();
  ctx.restore();
}

/* ============ БЮРЕТКА ============ */
function drawBurette(x, topY) {
  const w = 30, h = 300, cx = x + w / 2;
  softShadow(x - 6, topY + h - 8, w + 12, 0, 18);
  // стеклянная трубка
  ctx.fillStyle = 'rgba(215,232,252,0.12)';
  ctx.beginPath(); ctx.roundRect(x, topY, w, h, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(225,238,255,0.5)'; ctx.lineWidth = 1.8;
  ctx.stroke();
  // шкала
  ctx.strokeStyle = 'rgba(220,235,255,0.5)'; ctx.lineWidth = 1;
  for (let i = 0; i <= 10; i++) {
    const yy = topY + 10 + i * 28;
    ctx.beginPath(); ctx.moveTo(x + w - 4, yy); ctx.lineTo(x + w - (i % 2 ? 10 : 14), yy); ctx.stroke();
  }
  // жидкость (зелёная щёлочь)
  const liqTop = topY + 34, liqBot = topY + h - 16;
  const lg = ctx.createLinearGradient(0, liqTop, 0, liqBot);
  lg.addColorStop(0, '#8fd08a'); lg.addColorStop(1, '#3e8a5a');
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x, liqTop, w, liqBot - liqTop, 5); ctx.clip();
  ctx.fillStyle = lg; ctx.fillRect(x, liqTop, w, liqBot - liqTop);
  ctx.restore();
  glassHighlight(x, topY, w, h, 7);
  // кран
  ctx.fillStyle = '#8a93a8'; ctx.beginPath(); ctx.roundRect(cx - 8, topY + h - 12, 16, 10, 3); ctx.fill();
  ctx.fillStyle = '#5d6678';
  ctx.beginPath(); ctx.arc(cx, topY + h - 2, 4.5, 0, Math.PI * 2); ctx.fill();
}

/* ============ ШТАТИВ + СТАКАН ============ */
function drawStandAndBeaker(x, topY) {
  // штатив
  ctx.fillStyle = '#3a4256';
  ctx.beginPath(); ctx.roundRect(x - 3, topY, 8, 300, 3); ctx.fill();
  ctx.fillStyle = '#4a5470';
  ctx.beginPath(); ctx.roundRect(x - 26, topY + 88, 54, 8, 3); ctx.fill();
  ctx.fillStyle = '#2c3246';
  ctx.beginPath(); ctx.roundRect(x - 12, topY + 276, 26, 16, 3); ctx.fill();
  // стакан под бюреткой
  const bx = x - 26, by = topY + 118, bw = 52, bh = 74;
  softShadow(bx, by + bh - 8, bw, 0, 14);
  ctx.fillStyle = 'rgba(215,232,252,0.13)';
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(225,238,255,0.45)'; ctx.lineWidth = 1.6; ctx.stroke();
  const lg = ctx.createLinearGradient(0, by + 22, 0, by + bh);
  lg.addColorStop(0, '#8fd08a'); lg.addColorStop(1, '#3e8a5a');
  ctx.fillStyle = lg;
  ctx.beginPath(); ctx.roundRect(bx + 3, by + 22, bw - 6, bh - 24, 4); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.ellipse(bx + bw / 2, by + 22, bw / 2 - 4, 2.6, 0, 0, Math.PI * 2); ctx.fill();
  glassHighlight(bx, by, bw, bh, 6);
}

/* ============ ШТАТИВ С ПРОБИРКАМИ ============ */
function drawTestTubes(x, topY, cols) {
  const rackY = topY + 170;
  // стойка
  ctx.fillStyle = '#4a4250';
  ctx.beginPath(); ctx.roundRect(x - 20, rackY, 150, 8, 3); ctx.fill();
  ctx.fillStyle = '#38323e';
  ctx.beginPath(); ctx.roundRect(x - 8, rackY + 8, 126, 10, 3); ctx.fill();
  // пробирки
  const colors = [cols[0], cols[1], cols[2]];
  for (let i = 0; i < 3; i++) {
    const tx = x + i * 38;
    const tw = 22, th = 118, ty = topY + 44;
    softShadow(tx - 4, ty + th - 10, tw + 8, 0, 14);
    ctx.fillStyle = 'rgba(215,232,252,0.12)';
    ctx.beginPath(); ctx.roundRect(tx, ty, tw, th, 9); ctx.fill();
    ctx.strokeStyle = 'rgba(225,238,255,0.5)'; ctx.lineWidth = 1.6; ctx.stroke();
    const liqTop = ty + 26, liqBot = ty + th - 12;
    const lg = ctx.createLinearGradient(0, liqTop, 0, liqBot);
    lg.addColorStop(0, colors[i].light); lg.addColorStop(1, colors[i].dark);
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.roundRect(tx + 2, liqTop, tw - 4, liqBot - liqTop, 6); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.32)';
    ctx.beginPath(); ctx.ellipse(tx + tw / 2, liqTop, tw / 2 - 3, 2.4, 0, 0, Math.PI * 2); ctx.fill();
    glassHighlight(tx, ty, tw, th, 9);
  }
}

/* ============ ПОДПИСИ ============ */
function drawLabels() {
  ctx.fillStyle = 'rgba(232,226,212,0.65)'; ctx.font = '13px Georgia';
  ctx.textAlign = 'center';
  ctx.fillText('Бюретка · NaOH', 165, 516);
  ctx.fillText('Колба Эрленмейера', 585, 582);
  ctx.fillText('Штатив с пробирками', 960, 582);
  ctx.fillStyle = 'rgba(217,185,138,0.85)'; ctx.font = '12px Georgia';
  ctx.fillText(cur.name, 585, 610);
}

/* ============ ОСНОВНОЙ КАДР ============ */
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(bgCanvas, 0, 0);
  // тёплый ключевой свет слева-сверху (тонкая полоса)
  ctx.save();
  ctx.globalAlpha = 0.05 + 0.02 * Math.sin(time * 0.5);
  ctx.fillStyle = 'rgba(255,230,190,1)';
  ctx.fillRect(0, 0, W, 60);
  ctx.restore();

  drawBurette(150, 108);
  drawStandAndBeaker(160, 108);
  drawFlask(470, 120, 240, cur);
  const tubes = SUBSTANCES.slice(0, 3);
  drawTestTubes(875, 130, tubes);

  drawLabels();
  requestAnimationFrame(draw);
}

/* ============ УПРАВЛЕНИЕ ============ */
function buildControls() {
  const c = document.getElementById('controls');
  c.innerHTML = '';
  SUBSTANCES.forEach(s => {
    const b = document.createElement('button');
    b.className = 'sub-btn' + (s.id === cur.id ? ' sel' : '');
    b.textContent = s.name;
    b.onclick = () => { cur = s; buildControls(); updateInfo(); };
    c.appendChild(b);
  });
}
function updateInfo() {
  document.getElementById('info').innerHTML =
    '<b>Вещество:</b> ' + cur.name + ' · <b>цвет раствора:</b> ' + cur.desc;
}
function fps() {
  let frames = 0, last = performance.now();
  setInterval(() => {
    const now = performance.now();
    const f = frames * 1000 / (now - last);
    document.getElementById('fpsLabel').textContent = Math.round(f) + ' FPS';
    frames = 0; last = now;
  }, 1000);
  const loop = () => { frames++; requestAnimationFrame(loop); };
  loop();
}

renderBackground();
buildControls();
updateInfo();
fps();
(function tick(){ time += 0.016; requestAnimationFrame(tick); })();
draw();
</script>
</body>
</html>
