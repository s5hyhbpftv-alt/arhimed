<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>План обучения математике 1–9 · АРХИМЕД</title>
<style>
  :root{ --deep:#0b1712; --panel:#13251c; --card:#182f24; --card2:#101f18;
    --brass:#d9a441; --brass-d:#a3762a; --ivory:#e8e0cc; --muted:#8fa08f;
    --glass:#7fb8a0; --glow:#7fd1ff; --danger:#e86a5a; --ok:#5f9a6a; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:Georgia,'Times New Roman',serif; background:radial-gradient(ellipse at 50% -10%,#1a3226 0%,transparent 55%),var(--deep);
    color:var(--ivory); }
  .deck{ max-width:1000px; margin:0 auto; padding:18px; }
  .slide{ display:none; background:linear-gradient(160deg,var(--card),var(--card2)); border:1px solid rgba(217,164,65,.25);
    border-radius:18px; padding:26px 30px; min-height:520px; }
  .slide.on{ display:block; animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(8px);} to{opacity:1;} }
  h1{ color:var(--brass); font-size:30px; letter-spacing:.02em; }
  h2{ color:var(--brass); font-size:22px; margin:0 0 8px; }
  .kicker{ font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--glass); margin-bottom:4px; }
  .sub{ color:var(--muted); font-size:14px; margin-bottom:12px; }
  .cols{ display:flex; gap:16px; flex-wrap:wrap; }
  .col{ flex:1; min-width:260px; }
  .chip-row{ display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 10px; }
  .chip{ font-size:12px; padding:3px 10px; border-radius:999px; border:1px solid var(--hairline,rgba(217,164,65,.3)); }
  .chip.have{ background:rgba(95,154,106,.22); border-color:var(--ok); color:#b6e0bd; }
  .chip.gap{ background:rgba(232,106,90,.16); border-color:var(--danger); color:#ffc0b5; }
  .chip.olym{ background:rgba(127,209,255,.14); border-color:var(--glow); color:#bfe9ff; }
  ul{ list-style:none; }
  li{ padding:3px 0 3px 18px; position:relative; font-size:14px; line-height:1.5; }
  li:before{ content:"▸"; position:absolute; left:0; color:var(--brass); }
  li.have:before{ content:"✔"; color:var(--ok); }
  li.gap:before{ content:"✚"; color:var(--danger); }
  .legend{ font-size:12px; color:var(--muted); margin-bottom:8px; }
  .legend span{ margin-right:14px; }
  .nav{ display:flex; justify-content:center; align-items:center; gap:14px; margin-top:16px; }
  button{ font-family:inherit; background:var(--panel); color:var(--ivory); border:1.5px solid rgba(217,164,65,.4);
    border-radius:10px; padding:8px 16px; font-size:15px; cursor:pointer; }
  button:hover{ background:rgba(217,164,65,.15); }
  .cnt{ color:var(--muted); font-size:13px; }
  .badge{ display:inline-block; background:rgba(217,164,65,.18); color:var(--brass); border-radius:999px;
    padding:2px 10px; font-size:12px; font-weight:bold; margin-right:6px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  td,th{ border:1px solid rgba(217,164,65,.2); padding:5px 8px; text-align:left; vertical-align:top; }
  th{ color:var(--brass); }
  .big{ font-size:40px; color:var(--brass); }
</style>
</head>
<body>
<div class="deck" id="deck"><!-- slides injected --></div>
<div class="nav">
  <button onclick="mv(-1)">← Назад</button>
  <span class="cnt" id="cnt">1 / N</span>
  <button onclick="mv(1)">Вперёд →</button>
</div>
<script>
var SLIDES=["<div style=\"text-align:center;padding-top:55px\">\n  <div class=\"big\">🏆</div>\n  <div class=\"kicker\" style=\"margin-top:8px\">АРХИМЕД · аналитика</div>\n  <h1>Прогноз заданий математических олимпиад<br>на сезон 2025/26</h1>\n  <p class=\"sub\" style=\"margin-top:10px\">По анализу олимпиад последних 5 лет (2019/20–2024/25):<br>ВсОШ и МОШ (Россия) · IMO, EGMO, RMM (мир) · CMO (Китай) · INMO (Индия) ·<br>AMC/AIME/USAMO (США) · BMO, EMC, UK, Германия, Франция, Италия, Польша (Европа)</p>\n</div>", "<div class=\"kicker\">Методика</div><h2>Что проанализировано</h2>\n<div class=\"cols\">\n  <div class=\"col\"><h3 style=\"color:var(--glass)\">🌍 Охват</h3><ul>\n    <li>ВсОШ (4 этапа, 4–11 классы), ММО/МОШ (8–11), олимпиада Эйлера (8), Матпраздник (6–7)</li>\n    <li>IMO 61–66 (2020–2025), EGMO 9–14, RMM 12–16</li>\n    <li>Китай CMO+лига, Индия IOQM→INMO, США AMC/AIME/USA(J)MO</li>\n    <li>Европа: BMO/JBMO, Benelux, EMC, BMO1/BMO2 (UK), BWM (DE), Concours Général (FR), Cesenatico (IT), OME (ES), OM (PL), Cz/SK MO, ÖMO (AT), KöMaL (HU)</li></ul></div>\n  <div class=\"col\"><h3 style=\"color:var(--glass)\">📊 Что смотрим</h3><ul>\n    <li>Структуры и форматы (число задач, время, классы)</li>\n    <li>Темы 102 задач IMO/EGMO/RMM и комплектов ВсОШ/ММО</li>\n    <li>Повторяющиеся приёмы и «география стиля»</li>\n    <li>Тренды 5 лет → вероятностный прогноз на текущий сезон</li></ul></div>\n</div>\n<p class=\"sub\">Прогноз — вероятностный, на основе устойчивых трендов; не гарантия конкретных задач.</p>", "<div class=\"kicker\">Карта</div><h2>Кто и как проводит (кратко)</h2>\n<table>\n<tr><th>Олимпиада</th><th>Параллели/этап</th><th>Формат</th></tr>\n<tr><td>ВсОШ (РФ)</td><td>4–11 · школьный→муниципальный→региональный→финал</td><td>школьный — краткие ответы (Сириус); финал 9–11: 2 тура × 4 задачи (300 мин), по классам</td></tr>\n<tr><td>МОШ = ММО (Москва)</td><td>8–11</td><td>8–10: очно 5 ч; 11: отбор → финал 2 дня</td></tr>\n<tr><td>IMO · EGMO · RMM</td><td>мир (до 19–20 лет)</td><td>2 тура × 3 задачи, 7 баллов, 4,5 ч (макс. 42)</td></tr>\n<tr><td>США AMC→AIME→USA(J)MO</td><td>5–12</td><td>25 MCQ (75 мин) → 15 задач (3 ч, ответ 000–999) → 6 proof (2 дня)</td></tr>\n<tr><td>Китай CMO</td><td>нац. финал</td><td>6 задач за 2 дня, «тяжёлая техника»</td></tr>\n<tr><td>Индия INMO</td><td>нац. финал</td><td>6 proof-задач, ~4 ч</td></tr>\n<tr><td>BMO/JBMO, BxMO, EMC</td><td>регионы Европы</td><td>4 задачи, 4–4,5 ч (EMC: по одной на область)</td></tr>\n<tr><td>UK BMO1/BMO2</td><td>—</td><td>6 задач 3,5 ч → 4 задачи 3,5 ч</td></tr>\n<tr><td>Франция CG · Италия Cesenatico</td><td>—</td><td>CG: 5 ч, многочастные исследования; Cesenatico: 6 задач 4,5 ч</td></tr>\n</table>", "<div class=\"kicker\">Статистика</div><h2>Области в IMO/EGMO/RMM 2020–2025 (102 задачи)</h2>\n<div class=\"chip-row\">\n  <span class=\"chip have\">Комбинаторика — 28 (27,5%)</span>\n  <span class=\"chip have\">Геометрия — 28 (27,5%)</span>\n  <span class=\"chip have\">Теория чисел — 25 (24,5%)</span>\n  <span class=\"chip have\">Алгебра — 21 (20,6%)</span>\n</div>\n<div class=\"cols\">\n <div class=\"col\"><h3 style=\"color:var(--glass)\">IMO</h3><ul><li>Доминирует комбинаторика: 13/36 (в 2021 и 2025 — по 3 из 6 задач)</li><li>Алгебра — реже всего (6/36)</li><li>В 2024–2025 подъём теории чисел</li></ul></div>\n <div class=\"col\"><h3 style=\"color:var(--glass)\">EGMO</h3><ul><li>Геометрия — 11/36 (ядро)</li><li>Комбинаторика — реже (7/36)</li></ul></div>\n <div class=\"col\"><h3 style=\"color:var(--glass)\">RMM</h3><ul><li>Почти идеальный баланс: Г=К=ТЧ=8, Алг=6</li><li>Фирменная тема — многочлены</li></ul></div>\n</div>", "<div class=\"kicker\">Тренды 2020–2025</div><h2>Что меняется</h2>\n<div class=\"cols\">\n <div class=\"col\"><ul>\n  <li>«Комбинаторизация» IMO (игры, процессы, доски, графы)</li>\n  <li>Рост «именных» задач-персонажей: Turbo (IMO 2024 P5), EGMO 2023 P4, 2025 P5</li>\n  <li>Экстремально-конструктивные задачи («наименьшее k», оценка + пример)</li>\n  <li>«Цифрово-арифметические» сюжеты: v₂/v₃, суммы цифр, системы счисления (BMO2-2024, Cesenatico-2023, BWM-2022)</li></ul></div>\n <div class=\"col\"><ul>\n  <li>Сверхтяжёлые P3/P6: IMO 2022 P3 — 69% нулевых, RMM 2023 P3 — 0 полных, EGMO 2025 P6 — 2 полных</li>\n  <li>Классические AM–GM/КБШ на IMO после 2023 — реже (уходят в национальные)</li>\n  <li>Функциональные уравнения — стабильно ~1 задача/год на каждой</li>\n  <li>Форматы «заморожены»; онлайн-2020–21 сменился очным режимом</li></ul></div>\n</div>", "<div class=\"kicker\">Россия</div><h2>ВсОШ и ММО: вероятные темы по параллелям</h2>\n<div class=\"cols\">\n <div class=\"col\"><h3 style=\"color:var(--glass)\">4–6 (школьный этап)</h3><ul><li>Сюжетная арифметика, «хитрости с числами»</li><li>Логический перебор, закономерности</li><li>Взвешивания и переливания</li><li>Клетчатая бумага и разрезания</li><li>Чётность, простейшие игры</li><li>Делимость и остатки (базово)</li></ul></div>\n <div class=\"col\"><h3 style=\"color:var(--glass)\">7–8 (школьный/муниципальный, Эйлер)</h3><ul><li>Инварианты и раскраски</li><li>Принцип Дирихле и «крайнего»</li><li>«Оценка + пример»</li><li>Игры со стратегией (симметрия, копирование)</li><li>Начала графов</li><li>НОД/НОК, остатки, уравнения в целых (простые)</li><li>Геометрия: углы, треугольники, окружности</li></ul></div>\n <div class=\"col\"><h3 style=\"color:var(--glass)\">9–11 (регион и финал ВсОШ, ММО)</h3><ul><li>Неравенства: средние, оценки, уточнение констант</li><li>Функциональные уравнения и последовательности</li><li>Теория чисел: простые, порядки, квадратичные вычеты, диофантовы</li><li>Экстремальная комбинаторика, графы, продвинутые игры</li><li>Планиметрия: вписанные углы, степень точки, метод площадей</li></ul></div>\n</div>", "<div class=\"kicker\">Стили</div><h2>Чем отличаются школы</h2>\n<table>\n<tr><th></th><th>Сильные стороны / стиль</th><th>Тип задач</th></tr>\n<tr><td>🇺🇸 США</td><td>Комбинаторика и «одна чистая идея»; нет лёгких в USAMO</td><td>AMC/AIME — скорость и счёт; USAMO — короткие сильные доказательства</td></tr>\n<tr><td>🇨🇳 Китай (CMO)</td><td>Тяжёлая алгебра: неравенства (uvw/SOS), NT, ФУ, сложная геометрия</td><td>«Машина приёмов», уровень IMO P6, объёмные выкладки</td></tr>\n<tr><td>🇮🇳 Индия (INMO)</td><td>Комбинаторика + геометрия как ядро; растёт алгебра и ФУ</td><td>Пазл-подобные, нешаблонные; графы и игры</td></tr>\n<tr><td>🇪🇺 Европа</td><td>Культура IMO-shortlist; геометрия (Балканы/Центр), NT (UK/DE), анализ (FR)</td><td>Сбалансировано; комбинаторные идеи и полные доказательства</td></tr>\n<tr><td>🇷🇺 Россия</td><td>Комбинаторика/стратегии/ФУ, оценка+пример, инварианты</td><td>Классическая письменная олимпиада по параллелям</td></tr>\n</table>", "<div class=\"kicker\">Европа</div><h2>География стиля</h2>\n<div class=\"cols\">\n <div class=\"col\"><ul>\n  <li><b>BMO/центр и юго-восток</b> — геометрия: вписанные/вневписанные окружности, концикличность, степень точки</li>\n  <li><b>UK (BMO1/BMO2)</b> — теория чисел и геометрия (alternate segment, степени точки); год может быть «число-теоретически тяжёлым»</li>\n  <li><b>Германия (BWM)</b> — игривые NT/делимость и геометрия; аккуратное доказательство</li>\n  <li><b>Франция (CG)</b> — анализ/алгебра: рекурсии, пределы, p-адические оценки, многочлены</li></ul></div>\n <div class=\"col\"><ul>\n  <li><b>Италия (Cesenatico)</b> — NT + комбинаторика + геометрия, неравенства с симметричными полиномами</li>\n  <li><b>Чехия/Словакия, Польша, Австрия</b> — сбалансированно; укладки/полимино, рекуррентности, вневписанные окружности</li>\n  <li><b>Венгрия (KöMaL)</b> — месячный марафон уровней K→A (A — материал IMO-shortlist)</li>\n  <li>Почти везде: «процессные» задачи с подпунктами, шортлисты A/C/G/N</li></ul></div>\n</div>", "<div class=\"kicker\">Прогноз 2025/26 · Россия</div><h2>Младшие параллели (4–6, 7–8)</h2>\n<div class=\"cols\">\n <div class=\"col\"><h3 style=\"color:var(--glass)\">4–6</h3><ul>\n  <li>Логика и полный перебор, «кто есть кто»</li><li>Взвешивания/переливания, фальшивая монета</li>\n  <li>Клетчатая бумага: подсчёт, разрезания</li><li>Чётность, простейшие инварианты</li>\n  <li>Игры-стратегии (симметрия) и «найди все варианты»</li><li>Делимость/остатки, закономерности</li></ul></div>\n <div class=\"col\"><h3 style=\"color:var(--glass)\">7–8</h3><ul>\n  <li>Инварианты/полуинварианты и раскраски (доска, домино)</li>\n  <li>Дирихле и принцип крайнего</li><li>«Оценка + пример» (экстремальные конструкции)</li>\n  <li>Игры: анализ с конца, копирование ходов</li><li>Графы: степени вершин, обходы</li>\n  <li>НОД/НОК, остатки, уравнения в целых (простые)</li>\n  <li>Геометрия: углы при параллельных, равнобедренные треугольники</li></ul></div>\n</div>", "<div class=\"kicker\">Прогноз 2025/26 · Россия</div><h2>9–11: региональный/финал ВсОШ и ММО</h2>\n<div class=\"cols\">\n <div class=\"col\"><ul>\n  <li>Неравенства: средние, оценки, аккуратные константы, равенство</li>\n  <li>Функциональные уравнения и последовательности</li>\n  <li>Теория чисел: делимость, простые, порядки; на финале — квадратичные вычеты, диофантовы</li></ul></div>\n <div class=\"col\"><ul>\n  <li>Экстремальная комбинаторика и графы</li>\n  <li>Игры и стратегии (в т.ч. «именные» персонажи)</li>\n  <li>Планиметрия: вписанные углы, степень точки, метод площадей, преобразования</li>\n  <li>Задачи «оценка + пример» с формульными ответами</li></ul></div>\n</div>\n<p class=\"sub\">Школьный этап — чаще краткие ответы: тренируй быстрый счёт и «прикидку», письменные этапы — полноту доказательства.</p>", "<div class=\"kicker\">Прогноз 2026</div><h2>IMO-уровень: чего ждать в этом сезоне</h2>\n<div class=\"chip-row\"><span class=\"chip have\">Комбинаторика — вероятно 2 задачи из 6</span><span class=\"chip have\">Теория чисел — вероятно 1–2</span><span class=\"chip have\">Геометрия — почти гарантирована 1</span><span class=\"chip have\">Алгебра — 1–2 (ФУ или неравенство)</span></div>\n<ul>\n <li>Комбинаторика: игры/процессы/доски/графы, «монотонные процессы», экстремальный счёт, двойной подсчёт; возможен «именной» персонаж</li>\n <li>Теория чисел: делимость/LTE, p-адические оценки, «цифры» и системы счисления; рост с 2024–2025</li>\n <li>Геометрия: концикличность, инцентр/ортоцентр, степень точки (ежегодно с 2020)</li>\n <li>Алгебра: функциональные уравнения (вероятны), реже классические AM–GM — скорее «неравенство с идеей»</li>\n <li>Возможен многочлен (сильная традиция RMM/шортлистов) или задача-конструкция с формульным ответом</li>\n</ul>", "<div class=\"kicker\">Практика</div><h2>Что тренировать в АРХИМЕДЕ (топ приёмов)</h2>\n<div class=\"cols\">\n <div class=\"col\"><ul>\n  <li>Инварианты, полуинварианты, монотонные процессы</li><li>Игры и стратегии (симметрия, анализ с конца)</li>\n  <li>Графы: рукопожатия, эйлеровы пути, двудольные</li><li>«Оценка + пример» и экстремальный принцип</li>\n  <li>Раскраски и шахматная доска, домино</li><li>Принцип Дирихле и «крайнего»</li></ul></div>\n <div class=\"col\"><ul>\n  <li>Теория чисел: делимость/LTE, сравнения, порядки, «цифры»</li><li>Функциональные уравнения (подстановки, инъективность)</li>\n  <li>Геометрия: концикличность, степень точки, вписанные углы</li><li>Неравенства: средние, Коши, оценки</li>\n  <li>Комбинаторный подсчёт двумя способами, бином</li><li>Последовательности и рекуррентности</li></ul></div>\n</div>\n<p class=\"sub\">Приоритет по возрастам: 4–6 — логика/перебор/чётность; 7–8 — инварианты/Дирихле/графы; 9–11 и IMO — ТЧ/ФУ/неравенства/планиметрия + комбинаторика-процессы.</p>", "<div class=\"kicker\">Источники</div><h2>База анализа</h2>\n<ul>\n <li>ВсОШ: vos.olimpiada.ru · siriusolymp.ru · финал-2024 (2 тура × 4 задачи × 300 мин, по классам)</li>\n <li>ММО/МОШ: mmo.mccme.ru, mos.olimpiada.ru/tasks/math; олимпиада Эйлера matol.ru; Матпраздник olympiads.mccme.ru/matprazdnik</li>\n <li>IMO: imo-official.org; EGMO: egmo.org (9–14); RMM: rmms.lbi.ro (12–16); разборы Evan Chen (web.evanchen.cc), AoPS wiki</li>\n <li>США: MAA (amc-reg.maa.org, maa.org); AMC Club; Китай: AoPS CMO/China TST, Wikipedia CMO; Индия: AoPS INMO, Cheenta, PW/Aakash</li>\n <li>Европа: BMO-решения и шортлисты (BMOC), UKMT BMO1/BMO2, mathe-wettbewerbe.de (BWM), olimpiadi.dm.unibo.it (Febbraio/Cesenatico), RSME OME, om.sem.edu.pl (PL), matematickaolympiada.cz, oemo.at, komal.hu, EMC emc.mnm.hr</li>\n</ul>\n<p class=\"sub\">Примечание: официальной рубрикации IMO по областям нет — классификации редакционные; прогноз построен на устойчивых трендах и не гарантирует конкретные задачи.</p>"];
function render(){
  var d=document.getElementById('deck'); d.innerHTML='';
  SLIDES.forEach(function(s,i){
    var el=document.createElement('div'); el.className='slide'+(i===0?' on':'');
    el.id='s'+i; el.innerHTML=s; d.appendChild(el);
  });
  upd();
}
function mv(k){
  var cur=0; for(var i=0;i<SLIDES.length;i++){ if(document.getElementById('s'+i).classList.contains('on')){cur=i;break;} }
  var n=Math.max(0,Math.min(SLIDES.length-1,cur+k));
  document.getElementById('s'+cur).classList.remove('on');
  document.getElementById('s'+n).classList.add('on');
  upd(); window.scrollTo(0,0);
}
function upd(){ var on=0; for(var i=0;i<SLIDES.length;i++){ if(document.getElementById('s'+i).classList.contains('on')){on=i;break;} }
  document.getElementById('cnt').textContent=(on+1)+' / '+SLIDES.length; }
document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight') mv(1); if(e.key==='ArrowLeft') mv(-1); });
var TS=0, TE=0;
document.addEventListener('touchstart',function(e){ TS=e.touches[0].clientX; },{passive:true});
render();
document.addEventListener('touchend',function(e){ var dx=e.changedTouches[0].clientX-TS; if(dx<-40) mv(1); else if(dx>40) mv(-1); },{passive:true});
</script>
</body>
</html>
