<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пробная игра · 6 класс · АРХИМЕД</title>
<!-- ============ ПРОБНАЯ ИГРА (Genially) ============
     Отдельный экран: пробный хоррор-квест для 6 класса, сделанный во внешнем
     сервисе Genially. Уроки он не трогает и в их поток не встроен — отдельный
     экран, как просил владелец.

     Ссылка задана ниже (GENIALLY_URL). Если сети нет или сервис недоступен,
     экран честно об этом говорит, а уроки и тренажёры работают как обычно:
     они лежат в приложении и кешируются офлайн.
-->
<style>
  :root{ --deep:#0b1712; --brass:#d9a441; --ivory:#e8e0cc; --muted:#9fb0a0; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; font-family:Georgia,'Times New Roman',serif;
        background:radial-gradient(ellipse at 50% -10%,#1a3226 0%,transparent 55%),var(--deep);
        color:var(--ivory); display:flex; flex-direction:column; }
  header{ display:flex; align-items:center; gap:12px; padding:14px 16px 6px; }
  header .ico{ font-size:28px; }
  header h1{ margin:0; font-size:22px; color:var(--brass); }
  header p{ margin:2px 0 0; font-size:13px; color:var(--muted); }
  main{ flex:1; display:flex; flex-direction:column; padding:10px 16px 18px; gap:12px; }
  .рамка{ flex:1; position:relative; background:#0f2018; border:2px solid rgba(217,164,65,.35);
          border-radius:14px; overflow:hidden; min-height:320px; }
  .рамка iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .нет_сети{ display:none; margin:0; padding:10px 14px; border-radius:10px; font-size:15px;
             background:rgba(217,164,65,.16); border-left:4px solid var(--brass); }
  body.офлайн .нет_сети{ display:block; }
  body.офлайн .рамка{ display:none; }
  .кнопки{ display:flex; gap:10px; flex-wrap:wrap; }
  a.кнопка{ display:inline-flex; align-items:center; justify-content:center; min-height:46px;
            padding:10px 18px; border-radius:12px; font-size:16px; text-decoration:none;
            background:#182f24; color:var(--ivory); border:1.5px solid rgba(217,164,65,.35); }
  a.кнопка.главная{ background:linear-gradient(180deg,#ffd76a,#e2b23f); color:#20180a; font-weight:600; }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<header>
  <span class="ico">🕯</span>
  <div>
    <h1>Пробная игра</h1>
    <p>6 класс · хоррор-квест · пробный выпуск, не входит в уроки</p>
  </div>
</header>
<main>
  <p class="нет_сети">Похоже, сети нет. Пробная игра открывается из интернета, поэтому сейчас она недоступна — а уроки и тренажёры работают как обычно: они уже в приложении.</p>
  <div class="рамка"></div>
  <div class="кнопки">
    <a class="кнопка" href="../index.html">← На главную</a>
    <a class="кнопка" id="в_новой" href="https://view.genially.com/6aaadfd3e9d29ed1430ac055" target="_blank" rel="noopener">Открыть в новой вкладке ↗</a>
  </div>
</main>
<script>
  /* Ссылка на опубликованный материал Genially (пробный хоррор-квест, 6 класс). */
  var GENIALLY_URL = 'https://view.genially.com/6aaadfd3e9d29ed1430ac055';
  (function(){
    var рамка=document.querySelector('.рамка');
    function офлайн(){ document.body.classList.toggle('офлайн', navigator.onLine===false); }
    офлайн(); window.addEventListener('online',офлайн); window.addEventListener('offline',офлайн);
    if(GENIALLY_URL){
      var ф=document.createElement('iframe');
      ф.src=GENIALLY_URL; ф.setAttribute('allowfullscreen',''); ф.setAttribute('loading','lazy');
      ф.setAttribute('title','Пробная игра, 6 класс');
      рамка.appendChild(ф);
    }
  })();
</script>
</body>
</html>
