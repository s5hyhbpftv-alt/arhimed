<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>План обучения математике 1–9 · АРХИМЕД</title>
<style>
  :root{ --deep:#0b1712; --panel:#13251c; --card:#182f24; --card2:#101f18;
    --brass:#d9a441; --brass-d:#a3762a; --ivory:#e8e0cc; --muted:#8fa08f;
    --glass:#7fb8a0; --glow:#7fd1ff; --danger:#e86a5a; --ok:#5f9a6a; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:Georgia,'Times New Roman',serif; background:radial-gradient(ellipse at 50% -10%,#1a3226 0%,transparent 55%),var(--deep);
    color:var(--ivory); }
  .deck{ max-width:1000px; margin:0 auto; padding:18px; }
  .slide{ display:none; background:linear-gradient(160deg,var(--card),var(--card2)); border:1px solid rgba(217,164,65,.25);
    border-radius:18px; padding:26px 30px; min-height:520px; }
  .slide.on{ display:block; animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(8px);} to{opacity:1;} }
  h1{ color:var(--brass); font-size:30px; letter-spacing:.02em; }
  h2{ color:var(--brass); font-size:22px; margin:0 0 8px; }
  .kicker{ font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--glass); margin-bottom:4px; }
  .sub{ color:var(--muted); font-size:14px; margin-bottom:12px; }
  .cols{ display:flex; gap:16px; flex-wrap:wrap; }
  .col{ flex:1; min-width:260px; }
  .chip-row{ display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 10px; }
  .chip{ font-size:12px; padding:3px 10px; border-radius:999px; border:1px solid var(--hairline,rgba(217,164,65,.3)); }
  .chip.have{ background:rgba(95,154,106,.22); border-color:var(--ok); color:#b6e0bd; }
  .chip.gap{ background:rgba(232,106,90,.16); border-color:var(--danger); color:#ffc0b5; }
  .chip.olym{ background:rgba(127,209,255,.14); border-color:var(--glow); color:#bfe9ff; }
  ul{ list-style:none; }
  li{ padding:3px 0 3px 18px; position:relative; font-size:14px; line-height:1.5; }
  li:before{ content:"▸"; position:absolute; left:0; color:var(--brass); }
  li.have:before{ content:"✔"; color:var(--ok); }
  li.gap:before{ content:"✚"; color:var(--danger); }
  .legend{ font-size:12px; color:var(--muted); margin-bottom:8px; }
  .legend span{ margin-right:14px; }
  .nav{ display:flex; justify-content:center; align-items:center; gap:14px; margin-top:16px; }
  button{ font-family:inherit; background:var(--panel); color:var(--ivory); border:1.5px solid rgba(217,164,65,.4);
    border-radius:10px; padding:8px 16px; font-size:15px; cursor:pointer; }
  button:hover{ background:rgba(217,164,65,.15); }
  .cnt{ color:var(--muted); font-size:13px; }
  .badge{ display:inline-block; background:rgba(217,164,65,.18); color:var(--brass); border-radius:999px;
    padding:2px 10px; font-size:12px; font-weight:bold; margin-right:6px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  td,th{ border:1px solid rgba(217,164,65,.2); padding:5px 8px; text-align:left; vertical-align:top; }
  th{ color:var(--brass); }
  .big{ font-size:40px; color:var(--brass); }
</style>
</head>
<body>
<div class="deck" id="deck"><!-- slides injected --></div>
<div class="nav">
  <button onclick="mv(-1)">← Назад</button>
  <span class="cnt" id="cnt">1 / N</span>
  <button onclick="mv(1)">Вперёд →</button>
</div>
<script>
var SLIDES=["<div style=\"text-align:center;padding-top:60px\">\n  <div class=\"big\">🏛</div>\n  <div class=\"kicker\" style=\"margin-top:10px\">АРХИМЕД · методический план</div>\n  <h1>Единый учебный план математики<br>с 1 по 9 класс</h1>\n  <p class=\"sub\" style=\"margin-top:12px\">Углублённая линия: Петерсон «Учусь учиться» + программы углублённой математики<br>(Виленкин, Мерзляк/Поляков, Никольский, Дорофеев, Атанасян) + олимпиадная подготовка ВсОШ/МОШ (МЦНМО, Матпраздник, «Математическая вертикаль»)</p>\n  <div class=\"legend\" style=\"margin-top:16px\"><span><span class=\"chip have\">✔ есть в АРХИМЕДЕ</span></span> <span><span class=\"chip gap\">✚ добавить в АРХИМЕД</span></span></div>\n</div>", "<div class=\"kicker\">Как собран план</div><h2>Методика: ничего не пропустить</h2>\n<div class=\"cols\">\n  <div class=\"col\"><h3 style=\"color:var(--glass)\">📐 Школьная линия (углубление)</h3><ul>\n    <li>1–4: Петерсон «Учусь учиться» — опережающая программа (уравнения «часть–целое» с 1 кл, таблица умножения во 2 кл, многозначные числа и множества Эйлера–Венна в 3 кл, дроби и проценты в 4 кл)</li>\n    <li>5–6: углублённые Виленкин / Дорофеев–Петерсон (делимость и дроби в 5 кл, отношения/отрицательные в 6 кл)</li>\n    <li>7–9: алгебра углубл. (Мерзляк/Поляков, Никольский, Макарычев–Феоктистов) + геометрия (Атанасян/Погорелов) + элементы анализа в 9 кл</li></ul></div>\n  <div class=\"col\"><h3 style=\"color:var(--glass)\">🏆 Олимпиадная линия (ВсОШ/МОШ)</h3><ul>\n    <li>1–2: логика, смекалка, перебор, игры, взвешивания</li>\n    <li>3–4: рыцари и лжецы, чётность, инварианты, Дирихле, раскраски, «оценка+пример»</li>\n    <li>5–6: делимость, графы (рукопожатия, эйлеровы пути), комбинаторика, Дирихле, инварианты</li>\n    <li>7–9: теория чисел (сравнения, Ферма/Эйлер), неравенства (Коши, КБШ), индукция, комбинаторика (бином), геометрия (Менелай/Чева, метод площадей)</li></ul></div>\n</div>\n<p class=\"sub\" style=\"margin-top:6px\">Две линии объединены «по смыслу и этапам»: школьная тема в каждом классе сразу подкрепляется олимпиадным приёмом; повторяющиеся блоки (делимость, комбинаторика, геометрия) развёрнуты по спирали 1→9.</p>", "<div class=\"kicker\">Обзор</div><h2>Этапы обучения с 1 по 9 класс</h2>\n<table>\n<tr><th>Этап</th><th>Классы</th><th>Смысл этапа</th><th>Главные темы</th></tr>\n<tr><td>🌱 I</td><td>1–2</td><td>Число и действие: счёт, таблица сложения и умножения, величины, простые задачи</td><td>Числа до 1000; +/− и ·/:; уравнения «часть–целое»; логика-1; игры, перебор</td></tr>\n<tr><td>📐 II</td><td>3–4</td><td>Алгоритмы и модели: письменные вычисления, формулы, дроби, движение</td><td>Многозначные числа; P/S/V; s=v·t; доли→дроби→проценты; множества; олимп: чётность, Дирихле, инварианты</td></tr>\n<tr><td>🧮 III</td><td>5–6</td><td>Рациональные числа: дроби, делимость, отрицательные, пропорции</td><td>Дроби и десятичные; НОД/НОК, Евклид; отрицательные; координаты; олимп: графы, комбинаторика, Дирихле</td></tr>\n<tr><td>⚡ IV</td><td>7</td><td>Алгебра: выражения и уравнения; первая геометрия с доказательствами</td><td>Многочлены, ФСУ, системы, функции; треугольники, параллельные; олимп: модуль, параметры, сочетания, графы</td></tr>\n<tr><td>🚀 V</td><td>8–9</td><td>Функции и уравнения 2-й степени; геометрия с окружностью; подготовка к олимп. и ОГЭ</td><td>Квадратные уравнения/функции, неравенства, прогрессии; подобие, векторы, тригонометрия; олимп: индукция, теория чисел, КБШ, Менелай/Чева</td></tr>\n</table>", "<div class=\"kicker\">Единый план · математика · класс 1</div><h2>1 класс</h2><div class=\"cols\"><div class=\"col\"><h3 style=\"color:var(--glass);font-size:15px;margin:6px 0 4px\">📚 Школьная программа (углубл.: Петерсон + Виленкин/Мерзляк)</h3><ul><li class=\"\">Числа 1–10, состав числа, сравнение, знаки</li><li class=\"\">Сложение и вычитание в пределах 10 и 20 (переход через 10)</li><li class=\"\">Числовой отрезок, выражения, уравнения «часть–целое»</li><li class=\"\">Величины: длина (см, дм), масса (кг), объём (л), время</li><li class=\"\">Геометрия: линии, отрезок, ломаная, фигуры, круг</li><li class=\"\">Текстовые задачи в 1–2 действия, обратные задачи</li><li class=\"\">Закономерности, таблицы, логические высказывания</li></ul></div><div class=\"col\"><h3 style=\"color:var(--glass);font-size:15px;margin:6px 0 4px\">🏆 Олимпиадная линия (ВсОШ/МОШ, МЦНМО)</h3><ul><li class=\"\">Задачи «кто есть кто», истина/ложь</li><li class=\"\">Смекалка, задачи-шутки, магические квадраты</li><li class=\"\">Простейшие игры и стратегии (симметрия)</li><li class=\"\">Перебор, дерево вариантов, кодирование/шифры</li><li class=\"\">Клетчатая бумага: подсчёт, разрезания, кубики</li></ul></div></div><div class=\"chip-row\"><span class=\"chip have\">✔ В АРХИМЕДЕ: Счёт до 10, геометрические фигуры, комиксы-счёт (1–2 кл)</span></div><div class=\"chip-row\"><span class=\"chip gap\">✚ Добавить: Состав числа до 20, таблицы сложения, величины (длина/масса/объём/время), уравнения «часть–целое», простые задачи всех типов, логика-1</span></div>", "<div class=\"kicker\">Единый план · математика · класс 2</div><h2>2 класс</h2><div class=\"cols\"><div class=\"col\"><h3 style=\"color:var(--glass);font-size:15px;margin:6px 0 4px\">📚 Школьная программа (углубл.: Петерсон + Виленкин/Мерзляк)</h3><ul><li class=\"\">Числа до 100: разряды, устные и письменные вычисления (столбик)</li><li class=\"\">Таблица умножения и деления</li><li class=\"\">Внетабличное умножение/деление, деление с остатком</li><li class=\"\">Порядок действий, распределительное свойство</li><li class=\"\">Числа до 1000: нумерация, действия</li><li class=\"\">Величины: длина, масса, время, площадь, объём (куб)</li><li class=\"\">Углы, перпендикулярные и параллельные прямые, окружность (радиус, диаметр)</li><li class=\"\">Составные задачи в 2–4 действия, «на/в раз»</li></ul></div><div class=\"col\"><h3 style=\"color:var(--glass);font-size:15px;margin:6px 0 4px\">🏆 Олимпиадная линия (ВсОШ/МОШ, МЦНМО)</h3><ul><li class=\"\">Чётность (разбиения, ходы коня)</li><li class=\"\">Инварианты (простейшие)</li><li class=\"\">Дирихле — первое знакомство</li><li class=\"\">Раскраски и шахматная доска</li><li class=\"\">Взвешивания и переливания</li><li class=\"\">Игры: выигрышные стратегии</li><li class=\"\">Движение: скорость, время, расстояние</li></ul></div></div><div class=\"chip-row\"><span class=\"chip have\">✔ В АРХИМЕДЕ: Счёт до 100, часы и время, длина и масса, геометрия-1, комиксы (1–2)</span></div><div class=\"chip-row\"><span class=\"chip gap\">✚ Добавить: Таблица умножения на 2/3 — есть в 3 кл; внетабличное деление — в 3 кл; деление с остатком; площадь/объём; окружность/циркуль; все типы задач; логика-2</span></div>", "<div class=\"kicker\">Единый план · математика · класс 3</div><h2>3 класс</h2><div class=\"cols\"><div class=\"col\"><h3 style=\"color:var(--glass);font-size:15px;margin:6px 0 4px\">📚 Школьная программа (углубл.: Петерсон + Виленкин/Мерзляк)</h3><ul><li class=\"\">Многозначные числа (классы, миллионы), действия</li><li class=\"\">Письменное умножение/деление (на двузначное, с остатком)</li><li class=\"\">Умножение и деление на 10/100/1000</li><li class=\"\">Величины: г/кг/ц/т, сек/мин/час, руб/коп, площадь, стоимость</li><li class=\"\">Формулы P, S, V, s=v·t, обобщение a=b·c</li><li class=\"\">Уравнения простые и составные, неравенства</li><li class=\"\">Доли, задачи на долю числа и число по доле</li><li class=\"\">Множества, Эйлер–Венн, высказывания и связки, диаграммы</li><li class=\"\">Симметрия, развёртки</li></ul></div><div class=\"col\"><h3 style=\"color:var(--glass);font-size:15px;margin:6px 0 4px\">🏆 Олимпиадная линия (ВсОШ/МОШ, МЦНМО)</h3><ul><li class=\"\">Перебор и оценка («оценка + пример»)</li><li class=\"\">Взвешивания (фальшивая монета), переливания</li><li class=\"\">Делимость и остатки: признаки 2, 3, 5, 9, 10</li><li class=\"\">Правило суммы и произведения, дерево перебора</li><li class=\"\">Геометрия на клетках: периметр, площадь, разрезания</li><li class=\"\">Кон  (8–9)</td></tr>\n</table>\n<p class=\"sub\" style=\"margin-top:8px\">Сильные стороны платформы: богатая олимпиадная линия 5–6 классов (ВсОШ-стиль) и визуальные уроки 1–4. Главные пробелы — школьная программа 7–9 (функции, неравенства, геометрия), вероятности и статистика, систематическая геометрия 7–9.</p>", "<div class=\"kicker\">План развития</div><h2>Дорожная карта: что добавить (по волнам)</h2>\n<div class=\"cols\">\n  <div class=\"col\"><h3 style=\"color:var(--glass)\">Волна A · Началка 1–4</h3><ul>\n   <li class=\"gap\">1 кл: состав числа до 20, таблицы сложения, величины, уравнения «часть–целое»</li>\n   <li class=\"gap\">2 кл: таблица умножения (есть в 3 кл — сдвинуть/продублировать), деление с остатком, площадь/объём, окружность</li>\n   <li class=\"gap\">3 кл: многозначные числа и письменные алгоритмы, формулы s=v·t и a=b·c, множества</li>\n   <li class=\"gap\">4 кл: дроби и смешанные числа, проценты-начало, движение (началка), графики</li></ul></div>\n  <div class=\"col\"><h3 style=\"color:var(--glass)\">Волна B · 5–6</h3><ul>\n   <li class=\"gap\">Признаки на 3/9, простые числа и решето, алгоритм Евклида</li>\n   <li class=\"gap\">Координатная плоскость, осевая/центральная симметрия, диаграммы, вероятность</li>\n   <li class=\"gap\">Олимп-5: игры, оценка+пример; олимп-6: стратегии, эйлеровы пути, формула Пика</li></ul></div>\n  <div class=\"col\"><h3 style=\"color:var(--glass)\">Волна C · 7–9 (крупные пробелы)</h3><ul>\n   <li class=\"gap\">7 кл: системы уравнений, линейные функции и графики, неравенства, многочлены-полно; геометрия: равенство треугольников, параллельные прямые, медианы/высоты</li>\n   <li class=\"gap\">8 кл: рациональные дроби, квадратичная функция, неравенства/интервалы, параметры; геометрия: четырёхугольники, площади, подобие, окружность</li>\n   <li class=\"gap\">9 кл: тригонометрия, прогрессия геометрическая, векторы и координаты, синусы/косинусы, стереометрия-введение, вероятность/статистика</li>\n   <li class=\"gap\">Олимп 8–9: уравнения в целых, Коши/КБШ, индукция, Ферма/Эйлер, Менелай/Чева, двудольные графы</li></ul></div>\n</div>", "<div class=\"kicker\">Источники</div><h2>На что опирался план</h2>\n<ul>\n <li>Л.Г. Петерсон «Учусь учиться» 1–4 (программы УМК «Школа 2000»), углублённая линия 5–9 (алгебра Петерсон–Агаханов, геометрия 7–9)</li>\n <li>Углублённая математика 5–6 (Виленкин и др.), 7–9: Мерзляк/Поляков, Никольский, Дорофеев, Макарычев–Феоктистов, Мордкович/Николаев; геометрия Атанасян/Погорелов; ФРП «Математика» углублённый уровень</li>\n <li>«Математическая вертикаль» (vertical.sch-int.ru), программы МЦНМО, Математический праздник (olympiads.mccme.ru/matprazdnik), МОШ (olympiads.mccme.ru/mmo), ВсОШ (vos.olimpiada.ru), 100ballnik/материалы этапов</li>\n</ul>\n<p class=\"sub\" style=\"margin-top:10px\">Примечание: границы отдельных блоков могут смещаться на соседний класс между редакциями УМК (классика vs ФОП-2024) — план фиксирует смысловую последовательность, а не жёсткое расписание конкретного учебника.</p>"];
function render(){
  var d=document.getElementById('deck'); d.innerHTML='';
  SLIDES.forEach(function(s,i){
    var el=document.createElement('div'); el.className='slide'+(i===0?' on':'');
    el.id='s'+i; el.innerHTML=s; d.appendChild(el);
  });
  upd();
}
function mv(k){
  var cur=0; for(var i=0;i<SLIDES.length;i++){ if(document.getElementById('s'+i).classList.contains('on')){cur=i;break;} }
  var n=Math.max(0,Math.min(SLIDES.length-1,cur+k));
  document.getElementById('s'+cur).classList.remove('on');
  document.getElementById('s'+n).classList.add('on');
  upd(); window.scrollTo(0,0);
}
function upd(){ var on=0; for(var i=0;i<SLIDES.length;i++){ if(document.getElementById('s'+i).classList.contains('on')){on=i;break;} }
  document.getElementById('cnt').textContent=(on+1)+' / '+SLIDES.length; }
document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight') mv(1); if(e.key==='ArrowLeft') mv(-1); });
var TS=0, TE=0;
document.addEventListener('touchstart',function(e){ TS=e.touches[0].clientX; },{passive:true});
render();
document.addEventListener('touchend',function(e){ var dx=e.changedTouches[0].clientX-TS; if(dx<-40) mv(1); else if(dx>40) mv(-1); },{passive:true});
</script>
