<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Виртуальная лаборатория · Молярная масса</title>
<style>
:root{--wood:#8a5a32;--wood2:#6a4122;--wall:#d9e4f0;--ink:#1c2430;--blue:#2b4c7e;--amber:#e8b931}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#9aa8b8;color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
#app{height:100%;display:grid;grid-template-rows:46px minmax(0,1fr) 88px}
.top{background:#243652;color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px}
.top .brand{font-weight:800;letter-spacing:.04em}
.top .exp{opacity:.9;font-size:14px}
.mid{display:grid;grid-template-columns:120px minmax(0,1fr) 300px;min-height:0}
.cab{background:#e7edf5;border-right:1px solid #b7c3d4;padding:8px;overflow:auto}
.cab h4{margin:10px 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#5b6d84}
.tool{background:#fff;border:1px solid #c5d0de;border-radius:10px;padding:8px 6px;margin-bottom:8px;text-align:center;cursor:pointer;user-select:none}
.tool:hover,.tool.on{border-color:var(--blue);box-shadow:0 2px 8px rgba(43,76,126,.2)}
.scene{position:relative;background:#c5d3e2;overflow:hidden}
.scene svg.room{position:absolute;inset:0;width:100%;height:100%}
.side{background:#f4efe2;border-left:1px solid #d4c9a8;padding:12px 14px;overflow:auto}
.side h2{margin:0 0 8px;font-size:20px;color:var(--blue)}
.side p{margin:0 0 10px;font-size:15px;line-height:1.5}
.tip{background:#fff6d8;border:1px solid #e0c36a;border-radius:10px;padding:10px;font-size:14px;line-height:1.45}
.eq{font-family:Georgia,serif;background:#fff;border:1px dashed #c9b896;border-radius:8px;padding:8px;margin:8px 0;font-size:16px}
.bot{background:#1b2636;color:#e8eef6;display:flex;align-items:center;gap:10px;padding:8px 12px}
.bot .n{width:36px;height:36px;border-radius:50%;background:var(--amber);color:#1b2636;display:flex;align-items:center;justify-content:center;font-weight:800}
.bot .h{flex:1;font-size:14px;line-height:1.35}
.bot button{min-height:44px;border:0;border-radius:8px;padding:0 14px;font-weight:700;cursor:pointer}
.bot .go{background:var(--amber);color:#1b2636}
.bot .back{background:#3a4b63;color:#fff}
@media(max-width:900px){
  .mid{grid-template-columns:1fr;grid-template-rows:72px minmax(220px,1fr) 180px}
  .cab{display:flex;gap:8px;overflow:auto;border-right:0;border-bottom:1px solid #b7c3d4}
  .cab h4{display:none}
  .tool{min-width:84px;margin:0}
}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand">NOBOOK-LAB</div>
    <div class="exp">Опыт · определение молярной массы по навеске</div>
    <div id="status" style="margin-left:auto;font-size:13px;opacity:.85">весы готовы</div>
  </div>
  <div class="mid">
    <aside class="cab" id="cab"></aside>
    <section class="scene">
      <svg class="room" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#eef4fa"/><stop offset="1" stop-color="#c5d3e4"/>
          </linearGradient>
          <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c48a4a"/><stop offset="1" stop-color="#6a4122"/>
          </linearGradient>
          <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#d7eefc" stop-opacity=".35"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity=".05"/>
          </linearGradient>
          <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity=".25"/></filter>
        </defs>
        <rect width="900" height="520" fill="url(#wall)"/>
        <rect x="0" y="318" width="900" height="202" fill="url(#wood)"/>
        <rect x="0" y="310" width="900" height="12" fill="#d7a05a"/>
        <rect x="40" y="46" width="820" height="14" rx="2" fill="#8fa0b3"/>
        <rect x="680" y="70" width="160" height="110" rx="4" fill="#b9d6ee" stroke="#7d90a3"/>
        <line x1="760" y1="70" x2="760" y2="180" stroke="#7d90a3"/>
        <line x1="680" y1="125" x2="840" y2="125" stroke="#7d90a3"/>
        <g id="balance" filter="url(#sh)">
          <rect x="355" y="236" width="190" height="78" rx="8" fill="#3e4854" stroke="#1c232b"/>
          <rect x="372" y="248" width="156" height="36" rx="4" fill="#0d1116"/>
          <text id="lcd" x="450" y="274" text-anchor="middle" font-family="Consolas,monospace" font-size="22" fill="#7dff9a">18.00 г</text>
          <rect x="390" y="314" width="120" height="10" rx="2" fill="#2b333c"/>
          <rect x="400" y="208" width="100" height="28" rx="3" fill="#cfd6de" stroke="#5d6772"/>
          <ellipse cx="450" cy="208" rx="48" ry="7" fill="#e8edf2" stroke="#5d6772"/>
          <g id="onpan"></g>
        </g>
        <g class="botl" data-k="H2O" style="cursor:pointer">
          <rect x="118" y="232" width="44" height="78" rx="6" fill="#8fd3ff" stroke="#2a3a48" stroke-width="2"/>
          <rect x="128" y="220" width="24" height="16" rx="3" fill="#e8e8e8" stroke="#2a3a48"/>
          <text x="140" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#163044">H₂O</text>
        </g>
        <g class="botl" data-k="CO2" style="cursor:pointer">
          <rect x="188" y="232" width="44" height="78" rx="6" fill="#d9d9d9" stroke="#2a3a48" stroke-width="2"/>
          <rect x="198" y="220" width="24" height="16" rx="3" fill="#e8e8e8" stroke="#2a3a48"/>
          <text x="210" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#163044">CO₂</text>
        </g>
        <g class="botl" data-k="O2" style="cursor:pointer">
          <rect x="258" y="232" width="44" height="78" rx="6" fill="#ffb7a3" stroke="#2a3a48" stroke-width="2"/>
          <rect x="268" y="220" width="24" height="16" rx="3" fill="#e8e8e8" stroke="#2a3a48"/>
          <text x="280" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#163044">O₂</text>
        </g>
        <path d="M620 250 L610 310 Q640 324 670 310 L660 250 Z" fill="url(#glass)" stroke="#4a657a" stroke-width="2"/>
        <path d="M622 286 Q640 296 658 286" fill="#9bd7ff" opacity=".55"/>
        <text x="640" y="338" text-anchor="middle" font-size="11" fill="#2a3a48">стакан</text>
        <path d="M742 228 L742 248 L720 308 Q755 330 790 308 L768 248 L768 228 Z" fill="url(#glass)" stroke="#4a657a" stroke-width="2"/>
        <ellipse cx="755" cy="228" rx="16" ry="5" fill="none" stroke="#4a657a" stroke-width="2"/>
        <text x="755" y="338" text-anchor="middle" font-size="11" fill="#2a3a48">колба</text>
        <text x="450" y="370" text-anchor="middle" font-size="13" fill="#3d2a16">лабораторный стол · аналитические весы</text>
      </svg>
    </section>
    <aside class="side">
      <h2 id="title"></h2>
      <p id="text"></p>
      <div class="eq" id="eq"></div>
      <div class="tip" id="tip"></div>
    </aside>
  </div>
  <div class="bot">
    <div class="n" id="num">1</div>
    <div class="h" id="hint"></div>
    <button class="back" id="prev">Шаг назад</button>
    <button class="go" id="next">Следующий шаг</button>
  </div>
</div>
<script>
const DATA={H2O:{M:18,name:'вода',form:'H₂O'},CO2:{M:44,name:'углекислый газ',form:'CO₂'},O2:{M:32,name:'кислород',form:'O₂'}};
const STEPS=[
 {t:'Рабочее место',h:'Слева реактивы. Нажми флакон — он встанет на чашку весов.',x:'Это учебная лаборатория в духе NOBOOK: стол, шкаф, электронные весы и журнал. Мы взвешиваем порцию и смотрим, что такое моль.',e:'1 моль = 6,02·10²³ частиц',p:'Атом на бытовых весах не виден. Моль нужен, чтобы работать граммами.'},
 {t:'Молярная масса',h:'Оставь 1 моль воды. Экран — 18.00 г.',x:'M — масса одного моля, единица г/моль. Для воды 18 г/моль.',e:'M(H₂O) = 18 г/моль',p:'Не пиши «18 г», если имеешь в виду порцию в один моль.'},
 {t:'Счёт по формуле',h:'Сравни воду и кислород.',x:'H ≈ 1, O ≈ 16, C ≈ 12. Индекс умножает. Вода: 2·1+16=18. O₂: 2·16=32.',e:'H₂O → 2×1 + 16 = 18',p:'Не забудь второй водород.'},
 {t:'O и O₂',h:'Поставь флакон O₂.',x:'O — атом 16 г/моль. O₂ — молекула 32 г/моль.',e:'O = 16 · O₂ = 32',p:'Не путай атом и молекулу.'},
 {t:'CO₂',h:'Поставь CO₂. При 1 моль = 44.00 г.',x:'12+16+16=44. Моль считают по молекулам.',e:'M(CO₂)=44 г/моль',p:'Не дели 44 на 3.'},
 {t:'m = M · n',h:'Кнопками +моль / −моль меняй навеску.',x:'m — граммы на чашке, n — сколько молей, M — справочная масса.',e:'m = M · n',p:'n меняется ложкой, M — нет.'},
 {t:'Обратный ход',h:'2 моль воды = 36 г. Наоборот n = m/M.',x:'36/18=2 моль.',e:'n = m / M',p:'Не дели на число Авогадро.'},
 {t:'Отчёт',h:'Перебери три флакона при n=1.',x:'Вода 18, кислород 32, CO₂ 44.',e:'H₂O 18 · O₂ 32 · CO₂ 44',p:'Запиши M с единицей г/моль.'}
];
const S={step:0,kind:'H2O',n:1};
function cab(){
  const box=document.getElementById('cab');
  box.innerHTML='<h4>Реактивы</h4>'+item('H2O','вода')+item('CO2','CO₂')+item('O2','O₂')+'<h4>Навеска</h4><div class="tool" id="plus"><span>+ 1 моль</span></div><div class="tool" id="minus"><span>− 1 моль</span></div><div class="tool" id="reset"><span>снять</span></div>';
  box.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>{S.kind=el.dataset.k;draw();});
  document.getElementById('plus').onclick=()=>{S.n=Math.min(6,S.n+1);draw();};
  document.getElementById('minus').onclick=()=>{S.n=Math.max(1,S.n-1);draw();};
  document.getElementById('reset').onclick=()=>{S.n=1;S.kind='H2O';draw();};
}
function item(k,label){return '<div class="tool" data-k="'+k+'"><span>'+label+'</span><span style="color:#5b6d84">'+DATA[k].M+' г/моль</span></div>';}
function draw(){
  const f=STEPS[S.step], d=DATA[S.kind], m=d.M*S.n;
  document.getElementById('title').textContent=f.t;
  document.getElementById('text').textContent=f.x;
  document.getElementById('eq').textContent=f.e+'  ·  '+d.form+' · n='+S.n+' · m='+m+' г';
  document.getElementById('tip').textContent=f.p;
  document.getElementById('hint').textContent=f.h;
  document.getElementById('num').textContent=String(S.step+1);
  document.getElementById('lcd').textContent=m.toFixed(2)+' г';
  document.getElementById('status').textContent=d.name+' · '+S.n+' моль';
  const col={H2O:'#8fd3ff',CO2:'#d9d9d9',O2:'#ffb7a3'}[S.kind];
  document.getElementById('onpan').innerHTML='<rect x="422" y="184" width="56" height="24" rx="3" fill="'+col+'" stroke="#2a3a48"/><text x="450" y="201" text-anchor="middle" font-size="10" font-weight="700" fill="#163044">'+d.form+'</text>';
  document.querySelectorAll('.tool[data-k]').forEach(el=>el.classList.toggle('on',el.dataset.k===S.kind));
}
document.getElementById('next').onclick=()=>{S.step=Math.min(STEPS.length-1,S.step+1);draw();};
document.getElementById('prev').onclick=()=>{S.step=Math.max(0,S.step-1);draw();};
document.querySelectorAll('.botl').forEach(g=>g.addEventListener('click',()=>{S.kind=g.getAttribute('data-k');draw();}));
cab(); draw();
</script>
</body>
</html>
